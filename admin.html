<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <meta charset="UTF-8">
  <title>Dashboard Administrador</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <h1>Gestão de Pedidos</h1>

  <button id="btnSair">
    Sair
  </button>

  <div id="contadores" class="contadores"></div>

  <input
    type="text"
    id="campoBusca"
    placeholder="🔍 Buscar por nome, telefone ou e-mail..."
  >

  <div id="listaPedidos"></div>

  <!-- Modal Atendimento -->
  <div id="modalAtendimento" class="modal-atendimento">
    <div class="modal-atendimento-conteudo">
      <span class="fechar-atendimento" onclick="fecharAtendimento()">&times;</span>

      <h2>Atendimento</h2>

      <div id="conteudoAtendimento"></div>
    </div>
  </div>

  <!-- Modal Foto -->
  <div id="modalFoto" class="modal-foto">
    <button onclick="fecharFoto()" class="btn-voltar-foto">
      ← Voltar
    </button>

    <img id="fotoAmpliada" class="foto-ampliada">
  </div>

  <script src="admin.js"></script>

</body>
</html>
