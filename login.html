<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Toque Divino</title>

    <link rel="stylesheet" href="login.css">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Gowun+Batang&display=swap" rel="stylesheet">
</head>
<body>

    <div class="login-container">

        <img src="img/logo.png" alt="Toque Divino" class="logo-login">

        <h1>Painel Administrativo</h1>
        <p>Acesso restrito</p>

        <form id="formLogin">

            <input
                type="password"
                id="senha"
                placeholder="Digite a senha"
                required
            >

            <button type="submit">
                Entrar
            </button>

        </form>

    </div>

    <script src="login.js"></script>

</body>
</html>
